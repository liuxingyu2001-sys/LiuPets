name: '${project.name}'
version: '${project.version}'
description: 中文宠物、坐骑与养成系统，支持 Liu 插件生态联动
load: POSTWORLD
author: Nocsy
website: 'https://mcpets.gitbook.io/mcpets'

main: fr.nocsy.mcpets.MCPets
api-version: 1.21
database: false
prefix: '${project.name}'
depend:
  - MythicMobs
softdepend:
  - ModelEngine
  - BetterModel
  - Nexo
  - WorldGuard
  - LuckPerms
  - PlaceholderAPI
  - ItemsAdder
  - Liupass
  - mcSkills
loadbefore: []

# Plugin messaging channel "mcpets:sync" is registered in code via Bukkit.getMessenger()
# (the 'channels' key is not part of the Bukkit plugin descriptor schema)

commands:
  liupets:
    description: 打开宠物中心或管理宠物
    usage: /liupets
    permission: mcpets.use
    permission-message: '§c你没有使用此命令的权限。'
    aliases: [pets, mcpets, lpets]
  mcmounts:
    description: 打开坐骑菜单
    usage: /mcmounts
    permission: mcpets.use
    permission-message: '§c你没有使用此命令的权限。'
    aliases: [mounts]

permissions:
  liupets.use:
    default: true
    children:
      mcpets.use: true
  liupets.admin:
    default: op
    children:
      mcpets.admin: true
  liupets.color:
    default: op
    children:
      mcpets.color: true
  mcpets.use:
    default: true
  mcpets.admin:
    default: op
  mcpets.color:
    default: op
